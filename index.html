<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lights, Camera, Action!</title>
    <link rel="stylesheet" href="styles.css" />
    <script
      src="https://kit.fontawesome.com/8fad52e12c.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header>
      <h1>Lights, Camera, Action!</h1>
      <p>영화 정보 검색 사이트입니다.</p>
    </header>
    <section id="title">
      <p class="title-text">원하는 영화를 검색해보세요!</p>
      <div class="search-bar">
        <input
          type="text"
          id="search-input"
          placeholder="영화 제목을 입력하세요"
        />
        <button id="search-button">검색</button>
      </div>
    </section>
    <section id="movie-list-container">
      <h2>추천 영화</h2>
      <div class="movie-list"></div>
    </section>
    <div id="modal" class="modal hidden">
      <div class="modal-content">
        <span class="close">&times;</span>
        <div id="image-container">
          <div class="bookmark-container">
            <span class="bookmark-button">
              <i class="fa-regular fa-bookmark"></i>
            </span>
          </div>
          <img id="modal-image" src="" alt="Movie Poster" />
        </div>
        <div id="modal-body"></div>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
